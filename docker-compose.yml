# `version:` is obsolete in Compose v2 and only produces a warning.
services:
  llm-api:
    build: .
    container_name: streaming-llm-inference
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped